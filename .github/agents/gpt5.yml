# GPT-5 Copilot Agent Definition
# Định nghĩa agent dùng cho automation / trợ lý phát triển trong repo Arkham City.
# Lưu ý: GPT-5 là mô hình giả định (tương lai). Giữ cấu trúc linh hoạt để thay bằng model khác.

version: 0.1
kind: agent
name: arkham-city-copilot-gpt5
model:
  provider: openai
  name: gpt-5
  mode: chat
  capabilities:
    - reasoning
    - code-generation
    - function-calling
    - streaming
metadata:
  description: "Copilot GPT-5 hỗ trợ sinh mã, phân tích log, tạo tài liệu và đề xuất hành động trong hệ sinh thái Arkham City"
  owners:
    - id: min3rd
      role: maintainer
  tags:
    - ai
    - copilot
    - automation
  repository: arkham-city
context:
  ingestion:
    - path: arkham-city-core/src
    - path: arkham-city-dashboard/src
    - path: docs/
  exclude:
    - "**/node_modules/**"
    - "**/*.spec.ts"
  dynamic:
    - git.diff
    - git.history(50)
    - issues.open(20)
permissions:
  filesystem:
    read:
      - "arkham-city-core/src/**"
      - "arkham-city-dashboard/src/**"
      - "docs/**"
    write:
      - "arkham-city-core/src/**"
      - "arkham-city-dashboard/src/**"
      - "arkham-city-websdk/src/**"
  network:
    allow:
      - "https://api.openai.com/*"
    deny:
      - "*"
  actions:
    propose-only:
      - jira.create
      - repo.commit
      - pipeline.trigger
policies:
  safety:
    max_tokens: 4096
    temperature: 0.2
    disallowed_content:
      - hate
      - explicit
      - pii
  rate_limit:
    per_minute: 60
  guardrails:
    - name: secret-scan
      pattern: "(AKIA[0-9A-Z]{16}|secret_key|PRIVATE KEY)"
      action: block
  coding_standards:
    microservice_architecture: nestjs_rabbitmq
    enforce_broker: rabbitmq
    angular_syntax: latest
    angular_features:
      - standalone_components
      - modern_control_flow
      - signals
    no_console_logging: true
    no_code_comments: true
intents:
  - id: generate-code
    description: Sinh mã NestJS/Angular theo yêu cầu.
    examples:
      - "Tạo service NestJS gọi RabbitMQ"
  - id: analyze-log
    description: Phân tích log lỗi, cluster stacktrace.
  - id: write-docs
    description: Sinh README, tài liệu kiến trúc.
  - id: propose-action
    description: Đề xuất hành động tự động (tạo ticket, trigger pipeline).
triggers:
  manual:
    - command: /copilot
      format: "/copilot <intent> <prompt>"
  events:
    - source: project
      type: project.updated
    - source: repo
      type: pull_request.opened
outputs:
  format:
    default: markdown
    alternative:
      - json
      - text
  streaming:
    enabled: true
functions:
  - name: searchCode
    description: Tìm kiếm đoạn mã trong repo.
    parameters:
      query: string
  - name: createActionProposal
    description: Tạo payload đề xuất hành động.
    parameters:
      type: string
      summary: string
      data: object
workflow:
  steps:
    - build_context
    - classify_intent
    - safety_check
    - generate
    - post_process
    - propose_actions(optional)
logging:
  level: info
  fields:
    - requestId
    - intent
    - latencyMs
telemetry:
  metrics:
    - copilot_requests_total
    - copilot_latency_ms
    - copilot_actions_proposed_total
instructions:
  - "Được phép sửa mã nguồn trong các thư mục src của microservice, dashboard và websdk."
  - "Kiến trúc phải tuân thủ microservice với NestJS và sử dụng RabbitMQ làm message broker."
  - "Sử dụng cú pháp Angular mới nhất (standalone components, control flow hiện đại, signals; tránh tạo NgModule mới)."
  - "Không sử dụng console.log/console.error/debugger hoặc tương đương để debug."
  - "Không thêm comment vào code được sinh ra."
notes:
  - "Có thể thay 'gpt-5' bằng mô hình khác khi chưa sẵn sàng."
  - "Giữ functions tối giản, mở rộng qua file riêng nếu cần."
