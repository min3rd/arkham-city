services:
  # Supporting services
  mongo:
    image: mongo
    restart: unless-stopped
    expose:
      - "27017"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - arkham_network

  redis:
    image: redis
    restart: unless-stopped
    expose:
      - "6379"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arkham_network
  rabbitmq:
    image: rabbitmq:management
    restart: unless-stopped
    expose:
      - "15672" # RabbitMQ Management UI
      - "5672"   # RabbitMQ default port
    ports:
      - "15672:15672" # RabbitMQ Management UI
      - "5672:5672"   # RabbitMQ default port
    networks:
      - arkham_network
    environment:
      - RABBITMQ_DEFAULT_USER=arkham-city
      - RABBITMQ_DEFAULT_PASS=arkham-city
  # Gateway service
  gateway:
    build:
      context: ./arkham-city-core
      dockerfile: Dockerfile
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    expose:
      - 3000
    ports:
      - "3000:3000"
    environment:
      - APP_NAME=arkham-city-gateway
      - PORT=3000
      - MICROSERVICE_ONLY=false
      - MONGO_DB_URL=mongodb://mongo:27017/
      - MONGO_DB_METADATA=mongodb://mongo:27017/metadata
      - MONGO_DB_FIRESTORE=mongodb://mongo:27017/firestore
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://arkham-city:arkham-city@rabbitmq:5672
      - JWT_SECRET=ThisShouldBeSuperSecret
      - JWT_ACCESS_TOKEN_EXPIRES_IN=15m
      - JWT_REFRESH_TOKEN_EXPIRES_IN=1d
    networks:
      - arkham_network

  # Microservice instances
  microservice1:
    build:
      context: ./arkham-city-core
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    environment:
      - APP_NAME=arkham-city-microservice1
      - MICROSERVICE_ONLY=true
      - MONGO_DB_URL=mongodb://mongo:27017/
      - MONGO_DB_METADATA=mongodb://mongo:27017/metadata
      - MONGO_DB_FIRESTORE=mongodb://mongo:27017/firestore
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://arkham-city:arkham-city@rabbitmq:5672
      - JWT_SECRET=ThisShouldBeSuperSecret
    networks:
      - arkham_network

  microservice2:
    build:
      context: ./arkham-city-core
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    environment:
      - APP_NAME=arkham-city-microservice2
      - MICROSERVICE_ONLY=true
      - MONGO_DB_URL=mongodb://mongo:27017/
      - MONGO_DB_METADATA=mongodb://mongo:27017/metadata
      - MONGO_DB_FIRESTORE=mongodb://mongo:27017/firestore
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://arkham-city:arkham-city@rabbitmq:5672
      - JWT_SECRET=ThisShouldBeSuperSecret
    networks:
      - arkham_network

  microservice3:
    build:
      context: ./arkham-city-core
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    environment:
      - APP_NAME=arkham-city-microservice3
      - MICROSERVICE_ONLY=true
      - MONGO_DB_URL=mongodb://mongo:27017/
      - MONGO_DB_METADATA=mongodb://mongo:27017/metadata
      - MONGO_DB_FIRESTORE=mongodb://mongo:27017/firestore
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://arkham-city:arkham-city@rabbitmq:5672
      - JWT_SECRET=ThisShouldBeSuperSecret
    networks:
      - arkham_network

  # Dashboard service
  dashboard:
    build:
      context: ./arkham-city-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 80
    networks:
      - arkham_network

  # Nginx service
  nginx:
    image: nginx:latest
    ports:
      - "9666:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway
      - dashboard
    networks:
      - arkham_network

networks:
  arkham_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
