<div
  [ngClass]="{
    'flex-row-reverse': position === 'end',
    'flex-row': position === 'start',
  }"
  class="flex flex-auto w-full h-full overflow-hidden"
>
  <!-- Always render the drawer, visibility is controlled by the drawer component -->
  <ng-content select="ark-drawer"></ng-content>
  <ng-content select="ark-drawer-content"></ng-content>
</div>
