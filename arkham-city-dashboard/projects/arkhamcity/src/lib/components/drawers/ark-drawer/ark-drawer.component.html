<div
  [ngClass]="{
    'fixed top-0 z-40': mode === 'over',
    'left-0': mode === 'over' && position === 'start',
    'right-0': mode === 'over' && position === 'end',
    'ml-auto': mode === 'side' && position === 'end',
    'translate-x-0': mode === 'over' && opened,
    '-translate-x-full': mode === 'over' && !opened && position === 'start',
    'translate-x-full': mode === 'over' && !opened && position === 'end',
    'w-3/4 sm:w-1/2 md:w-1/3 lg:w-1/4': mode === 'over',
    'shadow-lg': mode === 'over' && opened,
    'w-0 overflow-hidden': mode === 'side' && !opened,
    'w-full': mode === 'side' && opened,
  }"
  class="flex-none h-full border-neutral-200 dark:border-neutral-700 transition-all ease-out duration-300 bg-white dark:bg-neutral-800"
>
  <ng-content></ng-content>
</div>
@if (mode === 'over' && opened) {
  <div
    class="fixed inset-0 bg-black bg-opacity-50 z-30 transition-opacity duration-300 ease-in-out opacity-40"
    (click)="close()"
    (keydown.escape)="close()"
    tabindex="0"
    role="button"
    aria-label="Close drawer"
  ></div>
}
