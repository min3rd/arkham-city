@if (user) {
  <div class="relative inline-flex dropdown-container">
    <button
      type="button"
      class="py-1 ps-1 pe-3 inline-flex items-center gap-x-2 text-sm font-medium border border-gray-200 bg-white text-gray-800 shadow-2xs hover:bg-gray-50 focus:outline-hidden focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800 hover:cursor-pointer"
      [ngClass]="{
        'rounded-full': rounded === 'full',
        'rounded-lg': rounded === 'lg',
        'rounded-md': rounded === 'md',
        'rounded-sm': rounded === 'sm',
      }"
      aria-haspopup="menu"
      [attr.aria-expanded]="isDropdownOpen"
      aria-label="Dropdown"
      (click)="toggleDropdown()"
      (keydown.enter)="toggleDropdown()"
      (keydown.space)="toggleDropdown(); $event.preventDefault()"
    >
      @if (user.avatar) {
        <img
          class="w-8 h-auto rounded-full"
          src="{{user.avatar}}"
          alt="Avatar"
        />
      } @else {
        <span
          class="inline-flex items-center justify-center size-8 rounded-full bg-gray-500 text-xs font-semibold text-white"
        >
      {{ (user.firstName ?? ' ').substring(0, 1) }}{{ (user.lastName ?? ' ').substring(0, 1) }}
    </span>
      }
      <span
        class="text-gray-600 font-medium truncate max-w-30 dark:text-neutral-400 hidden md:block"
      >
      {{ user.username }}
    </span>
      <ng-icon
        name="featherChevronDown"
        class="text-gray-500 dark:text-neutral-400"
      ></ng-icon>
    </button>

    <div
      class="absolute right-0 z-30 transition-[opacity,margin] duration min-w-60 bg-white shadow-md rounded-lg mt-2 dark:bg-neutral-800 dark:border dark:border-neutral-700"
      [ngClass]="{'opacity-100': isDropdownOpen, 'opacity-0 hidden': !isDropdownOpen}"
      role="menu"
      aria-orientation="vertical"
      tabindex="-1"
    >
      <div class="p-1 space-y-0.5">
        <a
          [routerLink]="['/profile']"
          class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-700 dark:hover:text-neutral-300 dark:focus:bg-neutral-700 hover:cursor-pointer"
        >
          {{ "profile" | transloco | titlecase }}
        </a>
        <a
          [routerLink]="['/log-out']"
          class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-700 dark:hover:text-neutral-300 dark:focus:bg-neutral-700 hover:cursor-pointer"
        >
          {{ "log out" | transloco | titlecase }}
        </a>
      </div>
    </div>
  </div>
}
