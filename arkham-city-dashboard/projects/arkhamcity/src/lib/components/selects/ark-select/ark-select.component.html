<div>
  @if (label) {
    <label
      for="select-{{ label }}"
      class="block text-sm font-medium mb-2 dark:text-white"
    >
      {{ label }}
    </label>
  }
  <div class="relative">
    @if (formFieldControl) {
      <select
        [formControl]="getFormControl()"
        (change)="change($event)"
        (blur)="onBlur()"
        id="select-{{ label ? label : '' }}"
        class="block w-full text-sm bg-neutral-200 border border-neutral-200 dark:text-white dark:bg-neutral-700 dark:border-neutral-700 hover:cursor-pointer"
        [ngClass]="{
          'rounded-xs': rounded === 'sm',
          'rounded-md': rounded === 'md',
          'rounded-lg': rounded === 'lg',
          'rounded-full': rounded === 'full',
          'py-3 px-4': size === 'md',
          'py-2 px-3': size === 'sm',
          'p-4 sm:p-5': size === 'lg',
        }"
      >
        @if (options) {
          <ng-container [ngTemplateOutlet]="options"></ng-container>
        }
      </select>
    } @else {
      <select
        (change)="change($event)"
        (blur)="onBlur()"
        [(ngModel)]="selectedValue"
        id="select-{{ label ? label : '' }}"
        class="block w-full text-sm bg-neutral-200 border border-neutral-300 dark:text-white dark:bg-neutral-700 dark:border-neutral-600 hover:cursor-pointer"
        [ngClass]="{
          'rounded-xs': rounded === 'sm',
          'rounded-md': rounded === 'md',
          'rounded-lg': rounded === 'lg',
          'rounded-full': rounded === 'full',
          'py-3 px-4': size === 'md',
          'py-2 px-3': size === 'sm',
          'p-4 sm:p-5': size === 'lg',
        }"
      >
        @if (options) {
          <ng-container [ngTemplateOutlet]="options"></ng-container>
        }
      </select>
    }
    @if (invalid) {
      <div
        class="absolute inset-y-0 end-0 flex items-center pointer-events-none pe-8"
      >
        <svg
          class="shrink-0 size-4 text-red-500"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" x2="12" y1="8" y2="12"></line>
          <line x1="12" x2="12.01" y1="16" y2="16"></line>
        </svg>
      </div>
    }
  </div>
  <div
    [ngClass]="{
      'min-h-6': !enableNoSuffixSpace()
    }"
  >
    @if (errors) {
      <ng-container [ngTemplateOutlet]="errors"></ng-container>
    }
  </div>
</div>
