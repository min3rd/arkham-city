<div class="relative">
  @if (label) {
    <label
      for="dropdown-{{ label }}"
      class="block text-sm font-medium mb-2 dark:text-white"
    >
      {{ label }}
    </label>
  }

  <div (clickOutside)="closeDropdown()" class="relative" clickOutside>
    <!-- Dropdown trigger button -->
    <button
      (click)="toggleDropdown()"
      [disabled]="enableDisabled()"
      [id]="'dropdown-' + (label ? label : '')"
      [ngClass]="{
        'rounded-xs': rounded === 'sm',
        'rounded-md': rounded === 'md',
        'rounded-lg': rounded === 'lg',
        'rounded-full': rounded === 'full',
        'py-3 px-4': size === 'md',
        'py-2 px-3': size === 'sm',
        'p-4 sm:p-5': size === 'lg',
        'opacity-50 cursor-not-allowed': enableDisabled()
      }"
      class="flex items-center justify-between w-full text-sm bg-neutral-200 border border-neutral-200 dark:text-white dark:bg-neutral-700 dark:border-neutral-700 hover:cursor-pointer transition-colors duration-200"
      type="button"
    >
      <span class="truncate">
        @if (selectedItems.length === 0) {
          {{ placeholder }}
        } @else if (multiple) {
          {{ selectedItems.length }} item(s) selected
        } @else {
          {{ selectedItems[0]?.label }}
        }
      </span>
      <svg
        class="shrink-0 size-4 ms-2"
        fill="none"
        height="24"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="m6 9 6 6 6-6"></path>
      </svg>
    </button>

    <!-- Dropdown menu -->
    @if (isOpen) {
      <div
        class="absolute z-10 w-full mt-1 bg-white border border-neutral-200 rounded-md shadow-lg dark:bg-neutral-800 dark:border-neutral-700"
      >
        @if (searchable) {
          <div class="p-2">
            <input
              type="text"
              [placeholder]="'Search...'"
              (input)="onSearch($event)"
              class="w-full p-2 text-sm border border-neutral-200 rounded-md dark:bg-neutral-700 dark:border-neutral-600 dark:text-white"
            />
          </div>
        }

        <div class="max-h-60 overflow-y-auto">
          @if (options) {
            <ng-container [ngTemplateOutlet]="options"
                          [ngTemplateOutletContext]="{searchText: searchText, selectItem: selectItem.bind(this), isSelected: isSelected.bind(this)}"></ng-container>
          }
        </div>

        @if (multiple && selectedItems.length > 0) {
          <div class="p-2 border-t border-neutral-200 dark:border-neutral-700">
            <button
              type="button"
              (click)="clearSelection()"
              class="w-full p-2 text-sm text-center text-red-500 hover:bg-neutral-100 rounded-md dark:hover:bg-neutral-700"
            >
              Clear selection
            </button>
          </div>
        }
      </div>
    }

    @if (invalid) {
      <div
        class="absolute inset-y-0 end-0 flex items-center pointer-events-none pe-8"
      >
        <svg
          class="shrink-0 size-4 text-red-500"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" x2="12" y1="8" y2="12"></line>
          <line x1="12" x2="12.01" y1="16" y2="16"></line>
        </svg>
      </div>
    }
  </div>

  <div
    [ngClass]="{
      'min-h-6': !enableNoSuffixSpace()
    }"
  >
    @if (errors) {
      <ng-container [ngTemplateOutlet]="errors"></ng-container>
    }
  </div>
</div>
