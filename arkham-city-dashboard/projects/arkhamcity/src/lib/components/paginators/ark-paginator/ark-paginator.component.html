<div class="flex items-center justify-center gap-2">
  <ark-button (onClick)="onPageChange(page - 1)" [color]="color" [disabled]="page <= 1" [rounded]="rounded"
              [size]="size"
              ghost icon="featherChevronLeft">
  </ark-button>
  @for (pageOption of getPageOptions(); track $index) {
    @if ($index === page - 1) {
      <ark-button
        [color]="color"
        [rounded]="rounded"
        [size]="size"
        solid
        disabled
      >
        {{ pageOption }}
      </ark-button>
    } @else {

      <ark-button
        (onClick)="onPageChange($index + 1)"
        [color]="color"
        [rounded]="rounded"
        [size]="size"
        ghost
      >
        {{ pageOption }}
      </ark-button>
    }
  }
  <ark-button (onClick)="onPageChange(page + 1)" [color]="color" [disabled]="page >= total/pageSize" [rounded]="rounded"
              [size]="size"
              ghost icon="featherChevronRight"></ark-button>
  <div class="text-sm text-neutral-500 dark:text-neutral-400">
    {{ (page - 1) * pageSize }} - {{ (page - 1) * pageSize + count }}
    / {{ total }}
  </div>
  <ark-select (onChange)="onPageSizeChange($event)" [(ngModel)]="pageSize" noSuffixSpace size="sm">
    <ng-template #options>
      @for (option of pageSizeOptions; track $index) {
        <option value="{{ option }}">
          {{ option }}
        </option>
      }
    </ng-template>
  </ark-select>
</div>
