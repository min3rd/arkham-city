<li id="{{ navigation.id }}">
  <button
    (click)="toggleChildren($event)"
    aria-expanded="true"
    class="w-full text-start flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-800 rounded-lg hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100 dark:bg-neutral-800 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700 dark:text-neutral-200"
    type="button"
  >
    @if (navigation.icon) {
      <ng-icon name="{{ navigation.icon }}"></ng-icon>
    }
    {{ navigation.title | transloco | titlecase }}
    <div class="ml-auto">
      @if (expanded) {
        <ng-icon name="featherChevronUp" class="text-gray-500"></ng-icon>
      } @else {
        <ng-icon name="featherChevronDown" class="text-gray-500"></ng-icon>
      }
    </div>
  </button>

  @if (navigation.children && navigation.children.length) {
    <div
      id="{{ navigation.id }}-collapse-1"
      class="w-full overflow-hidden transition-[height] duration-300 hidden"
      role="region"
    >
      <ul
        class="flex flex-col pt-1 ps-7 space-y-1"
      >
        @for (child of navigation.children; track $index) {
          @if (child.type === 'basic') {
            <ark-navigation-basic-item
              [navigation]="child"
            ></ark-navigation-basic-item>
          }
          @if (child.type === 'group') {
            <ark-navigation-group-item
              [navigation]="child"
            ></ark-navigation-group-item>
          }
        }
      </ul>
    </div>
  }
</li>
