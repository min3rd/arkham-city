<div
  [class.rounded-full]="rounded === 'full'"
  [class.rounded-lg]="rounded === 'lg'"
  [class.rounded-md]="rounded === 'md'"
  [class.rounded-sm]="rounded === 'sm'"
  class="flex flex-col w-full h-full"
>
  <div class="border-b border-neutral-300 dark:border-neutral-600">
    <nav aria-label="Tabs" aria-orientation="horizontal" class="flex gap-x-1 overflow-auto" role="tablist">
      @if (titles && titles.length) {
        @for (title of titles; track title.id; let i = $index) {
          <button
            (click)="change(i)"
            (keydown.arrowRight)="change(i < titles.length - 1 ? i + 1 : 0)"
            (keydown.arrowLeft)="change(i > 0 ? i - 1 : titles.length - 1)"
            class="inline-flex items-center"
            [class.font-semibold]="selectedIndex === i"
            [class.text-sm]="selectedIndex !== i"
            [class.dark:text-neutral-400]="selectedIndex !== i"

            [class.text-gray-700]="!title.disabled && selectedIndex !== i && color === 'gray'"
            [class.dark:text-white]="!title.disabled && selectedIndex !== i"
            [class.text-gray-500]="title.disabled && selectedIndex !== i"
            [class.dark:text-gray-700]="title.disabled && selectedIndex !== i"

            [class.hover:text-gray-600]="color === 'gray' && !title.disabled && selectedIndex !== i"
            [class.dark:hover:text-gray-500]="color === 'gray' && !title.disabled && selectedIndex !== i"
            [class.border-gray-600]="color === 'gray' && selectedIndex === i"
            [class.text-gray-600]="color === 'gray' && selectedIndex === i"
            [class.border-b-2]="selectedIndex === i"

            [class.hover:text-teal-600]="color === 'teal' && !title.disabled && selectedIndex !== i"
            [class.dark:hover:text-teal-500]="color === 'teal' && !title.disabled && selectedIndex !== i"
            [class.border-teal-600]="color === 'teal' && selectedIndex === i"
            [class.text-teal-600]="color === 'teal' && selectedIndex === i"

            [class.hover:text-blue-600]="color === 'blue' && !title.disabled && selectedIndex !== i"
            [class.dark:hover:text-blue-500]="color === 'blue' && !title.disabled && selectedIndex !== i"
            [class.border-blue-600]="color === 'blue' && selectedIndex === i"
            [class.text-blue-600]="color === 'blue' && selectedIndex === i"

            [class.hover:text-red-600]="color === 'red' && !title.disabled && selectedIndex !== i"
            [class.dark:hover:text-red-500]="color === 'red' && !title.disabled && selectedIndex !== i"
            [class.border-red-600]="color === 'red' && selectedIndex === i"
            [class.text-red-600]="color === 'red' && selectedIndex === i"

            [class.hover:text-yellow-600]="color === 'yellow' && !title.disabled && selectedIndex !== i"
            [class.dark:hover:text-yellow-500]="color === 'yellow' && !title.disabled && selectedIndex !== i"
            [class.border-yellow-600]="color === 'yellow' && selectedIndex === i"
            [class.text-yellow-600]="color === 'yellow' && selectedIndex === i"

            [class.py-2]="size === 'sm'"
            [class.px-1]="size === 'sm'"
            [class.gap-x-2]="size === 'sm'"
            [class.py-3]="size === 'md'"
            [class.px-2]="size === 'md'"
            [class.gap-x-3]="size === 'md'"
            [class.py-4]="size === 'lg'"
            [class.px-3]="size === 'lg'"
            [class.gap-x-4]="size === 'lg'"

            type="button"
            role="tab"
            [attr.aria-selected]="selectedIndex === i"
            [attr.aria-controls]="'tab-' + title.id"
            [attr.id]="'tab-button-' + title.id"
            [disabled]="title.disabled"
            [attr.tabindex]="selectedIndex === i ? 0 : -1"
          >
            @if (title.icon) {
              <ark-icon [name]="title.icon" aria-hidden="true"></ark-icon>
            }
            {{ title.title }}
          </button>
        }
      }
    </nav>
  </div>
  <div class="w-full overflow-auto">
    <ng-content></ng-content>
  </div>
</div>
