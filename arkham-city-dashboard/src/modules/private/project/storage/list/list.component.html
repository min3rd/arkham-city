<ark-drawer-container>
  <ark-drawer-content class="h-full border-r border-neutral-200 dark:border-neutral-700">
    <div class="flex flex-auto flex-col w-full h-full">
      <ark-datatable
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (search)="onSearch($event)"
        [data]="files()"
        [pageSize]="pageSize()"
        [page]="page()"
        [total]="total()"
        class="flex flex-auto flex-col w-full h-full"
        rounded="md"
        size="sm"
      >
        @if (isLoading()) {
          <div class="flex items-center justify-center p-8">
            <div class="text-neutral-500">{{ 'loading files' | transloco | capitalize }}...</div>
          </div>
        } @else if (files().length === 0) {
          <div class="flex items-center justify-center p-8">
            <div class="text-neutral-500">{{ 'no files found upload your first file to get started' | transloco | capitalize }}.</div>
          </div>
        } @else {
          @for (file of files(); track file._id) {
            <button
              type="button"
              class="p-2 hover:bg-neutral-50 dark:hover:bg-neutral-800 hover:cursor-pointer transition-colors w-full text-left"
              (click)="onFileClick(file)"
            >
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 flex-1 min-w-0">
                  <div class="flex-shrink-0">
                    <ng-icon
                      [name]="'feather' + getFileIcon(file.mimeType)"
                      class="text-base text-neutral-600 dark:text-neutral-400"
                    ></ng-icon>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="font-semibold truncate line-clamp-1">
                      {{ file.originalName }}
                    </div>
                    <div class="text-xs text-neutral-500 dark:text-neutral-400">
                      {{ file.createdAt | date: 'short' }}
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-1 flex-shrink-0">
                  <ark-button
                    (click)="deleteFile(file, $event)"
                    size="sm"
                    variant="ghost"
                    title="Delete file"
                  >
                    <ng-icon name="featherTrash2" class="text-red-600 dark:text-red-400"></ng-icon>
                  </ark-button>
                </div>
              </div>
            </button>
            <div class="border-b border-neutral-200 dark:border-neutral-700"></div>
          }
        }
      </ark-datatable>
    </div>
  </ark-drawer-content>
  <ark-drawer #drawer class="w-full" position="end">
    <router-outlet></router-outlet>
  </ark-drawer>
</ark-drawer-container>
