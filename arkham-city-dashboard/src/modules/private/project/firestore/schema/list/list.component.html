<ark-drawer-container>
  <ark-drawer #drawer [opened]="false" position="end">
    <router-outlet></router-outlet>
  </ark-drawer>
  <ark-drawer-content class="flex flex-auto flex-col w-full h-full">
    <form (submit)="search()" [formGroup]="form"
          class="flex items-center p-2 gap-2 border-b border-neutral-200 dark:border-neutral-700">
      <ark-text-input [formFieldControl]="form.get('search')" class="w-full" noSuffixSpace
                      rounded="full" size="sm"></ark-text-input>
      <ark-button (onClick)="search()" rounded="full" size="sm">
        {{ 'search' | transloco | capitalize }}
      </ark-button>
      <ark-button ghost icon="featherList"></ark-button>
      <ark-button ghost icon="featherGrid"></ark-button>
    </form>
    <div class="flex flex-auto flex-col w-full h-full overflow-auto">
      @if (pageSchema && pageSchema.data.length) {
        @for (schema of pageSchema.data; track $index) {
          <a [routerLink]="[schema.rawName]"
             class="p-2 hover:cursor-pointer">
            <div>
              <div>
                {{ schema.rawName }}
              </div>
              <div class="text-xs text-neutral-500 dark:text-neutral-400">
                {{ schema.updatedAt | date: 'short' }}
              </div>
            </div>
          </a>
          <div class="border-b border-neutral-200 dark:border-neutral-700"></div>
        }
      } @else {
        <span>
          {{ 'there are no records' | transloco | capitalize }}
        </span>
      }
    </div>
    <div class="p-2 border-t border-neutral-200 dark:border-neutral-700">
      <ark-paginator (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)"
                     [count]="pageSchema.data.length"
                     [pageSizeOptions]="[10,20,30,50,100]" [pageSize]="pageSchema.size"
                     [page]="pageSchema.page"
                     [total]="pageSchema.total" disablePageSelector size="sm"></ark-paginator>
    </div>
  </ark-drawer-content>
</ark-drawer-container>
