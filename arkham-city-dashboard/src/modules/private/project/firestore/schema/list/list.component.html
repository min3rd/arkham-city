<ark-drawer-container>
  <ark-drawer #drawer [opened]="false" class="w-full" position="end">
    <router-outlet></router-outlet>
  </ark-drawer>
  <ark-drawer-content class="flex flex-auto flex-col h-full border-r border-neutral-200 dark:border-neutral-700">
    <ark-datatable (pageChange)="onPageChange($event)"
                   (pageSizeChange)="onPageSizeChange($event)"
                   (search)="onSearch($event)"
                   [data]="pageSchema.data"
                   [pageSize]="pageSchema.size"
                   [page]="pageSchema.page"
                   [total]="pageSchema.total"
                   class="flex flex-auto flex-col w-full h-full"
                   rounded="md"
                   size="sm">
      @for (schema of pageSchema.data; track $index) {
        <a [routerLink]="[schema.rawName]" class="p-2 hover:cursor-pointer">
          <div class="flex flex-col">
            <div class="font-semibold">
              {{ schema.rawName }}
            </div>
            <div class="text-xs text-neutral-500 dark:text-neutral-400">
              {{ schema.updatedAt | date: 'short' }}
            </div>
          </div>
        </a>
        <div class="border-b border-neutral-200 dark:border-neutral-700"></div>
      }
    </ark-datatable>
  </ark-drawer-content>
</ark-drawer-container>
