<ark-drawer-container>
  <ark-drawer #drawer [opened]="false" position="end">
    <router-outlet></router-outlet>
  </ark-drawer>
  <ark-drawer-content class="flex flex-auto flex-col w-full h-full p-2">
    <div class="flex gap-2">
      <ark-text-input class="w-full" rounded="full"></ark-text-input>
      <ark-button>
        {{ 'search' | transloco | capitalize }}
      </ark-button>
    </div>
    <div class="flex flex-auto flex-col w-full h-full">
      @if (schemas && schemas.length) {
        @for (schema of schemas; track $index) {
          <div>
            {{ schema.rawName }}
          </div>
        }
      } @else {
        <span>
          {{ 'there are no records' | transloco | capitalize }}
        </span>
      }
    </div>
  </ark-drawer-content>
</ark-drawer-container>
