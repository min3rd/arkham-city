<div class="w-full h-full">
  @if (rules && rules.length > 0) {
    @for (rule of rules; track $index) {
      <div class="flex w-full items-center border-b border-neutral-200 dark:border-neutral-700 p-2 gap-2">
        <div>
          {{ rule.schema }}
        </div>
        @for (_rule of rule.rules; track _rule) {
          @if (_rule.conditions) {
            <ark-badge>
              {{ _rule.type }}
            </ark-badge>
          }
        }
      </div>
    }
  }
</div>
