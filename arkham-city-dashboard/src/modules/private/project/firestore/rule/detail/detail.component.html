<div>
  <form [formGroup]="form">
    <div class="p-2">
      <ark-text-input
        [formFieldControl]="form.get( 'schema')"
        label="{{'schema' | transloco | capitalize}}"
        noSuffixSpace>
      </ark-text-input>
    </div>
    <div class="py-2">
      @if (tabs) {
        <ark-tab-group [titles]="tabs">
          @for (tab of tabs; track $index; ) {
            <ark-tab-content [title]="tab.title">
              <div class="flex p-2 w-full border-b border-neutral-200 dark:border-neutral-700">
                <ark-button
                  (onClick)="newCondition($index)"
                  label="{{'new condition' | transloco | capitalize}}"
                  size="sm"
                  icon="featherPlus"></ark-button>
              </div>
              <div class="max-h-96 mt-2 py-2 px-2 overflow-auto">
                @for (condition of getConditionControls($index); track condition) {
                  <ark-select
                    [formFieldControl]="condition.get('condition')"
                    label="{{'condition' | transloco | capitalize}}">
                    <ng-template #options>
                      <option value="" disabled selected>
                        {{ 'choose' | transloco | capitalize }}
                      </option>
                      @for (type of ruleConditionTypes; track type) {
                        <option value="{{type}}">{{ type | transloco | capitalize }}</option>
                      }
                    </ng-template>
                  </ark-select>
                  <ark-text-input
                    [formFieldControl]="condition.get('customCondition')"
                    label="{{'custom' | transloco | capitalize}}"></ark-text-input>
                }
              </div>
            </ark-tab-content>
          }
        </ark-tab-group>
      }
    </div>
    <div class="flex items-center p-2">
      <ark-button
        color="red"
        ghost
        label="{{'delete' | transloco | capitalize}}"
        size="sm">
      </ark-button>
      <ark-button
        [routerLink]="['..']"
        class="ml-auto"
        ghost
        label="{{'cancel' | transloco | capitalize}}"
        size="sm"
      >
      </ark-button>
      @if (!schemaRule) {
        <ark-button
          (onClick)="create()"
          label="{{'create' | transloco | capitalize}}"
          size="sm"
          class="ml-2"
        >
        </ark-button>
      }
      @if (schemaRule) {
        <ark-button
          (onClick)="update()"
          label="{{'update' | transloco | capitalize}}"
          size="sm"
          class="ml-2"
        >
        </ark-button>
      }
    </div>
  </form>
</div>
