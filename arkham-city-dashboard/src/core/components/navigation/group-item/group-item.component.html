<li id="{{ navigation.id }}">
  <button
    aria-expanded="true"
    class="w-full text-start flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-800 rounded-lg hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100 dark:bg-neutral-800 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700 dark:text-neutral-200"
    type="button"
  >
    @if (navigation.icon) {
      <ng-icon name="{{ navigation.icon }}"></ng-icon>
    }
    {{ navigation.title | transloco | titlecase }}
    <svg
      class="ms-auto hidden size-4 text-gray-600 group-hover:text-gray-500 dark:text-neutral-400"
      fill="none"
      height="24"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      viewBox="0 0 24 24"
      width="24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="m18 15-6-6-6 6" />
    </svg>

    <svg
      class="ms-auto block size-4 text-gray-600 group-hover:text-gray-500 dark:text-neutral-400"
      fill="none"
      height="24"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      viewBox="0 0 24 24"
      width="24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (navigation.children && navigation.children.length) {
    <div
      id="{{ navigation.id }}-collapse-1"
      class="w-full overflow-hidden transition-[height] duration-300 hidden"
      role="region"
    >
      <ul
        class="pt-1 ps-7 space-y-1"
      >
        @for (child of navigation.children; track $index) {
          @if (child.type ===
          'basic') {
            <ark-navigation-basic-item
              [navigation]="child"
            ></ark-navigation-basic-item>
          }
          @if (child.type === 'group') {
            <ark-navigation-group-item
              [navigation]="child"
            ></ark-navigation-group-item>
          }
        }
      </ul>
    </div>
  }
</li>
