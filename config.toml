baseURL = "https://min3rd.github.io/arkham-city/"
languageCode = "en-us"
title = "Arkham City Documentation"
theme = "docsy"
contentDir = "docs/content"

# Enable search functionality
[outputs]
home = ["HTML", "RSS", "JSON"]

# Configure parameters
[params]
# Description of the site will be used in meta-information
description = "Documentation for the Arkham City project"
# Author of the site will be used in meta-information
author = "Arkham City Team"

# Docsy theme parameters
# UI
ui_pref = "light"  # light, dark, or auto
# Links to source code
github_repo = "https://github.com/min3rd/arkham-city"
github_branch = "develop"

# For search functionality
[outputFormats.JSON]
baseName = "index"
isPlainText = true
mediaType = "application/json"
notAlternative = true
